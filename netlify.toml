# Netlify-Deploy für die TanStack-Start-App (SSR via Nitro "netlify"-Preset).
# Der Build erzeugt:
#   - dist/                         -> statische Assets (publish)
#   - .netlify/functions-internal/  -> SSR-Function (von Netlify automatisch deployt)
# Das Routing steckt als In-Source-Config (config.path = "/*", preferStatic)
# direkt in der Function – daher ist keine [[redirects]]-Regel nötig.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 301-Weiterleitungen der alten WordPress-URLs (SEO-Erhalt beim Umzug von IONOS)
[[redirects]]
  from = "/unsere-pools"
  to = "/poolabdeckungen"
  status = 301
  force = true

[[redirects]]
  from = "/daecher-2"
  to = "/daecher"
  status = 301
  force = true

[[redirects]]
  from = "/hello-world"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/category/uncategorized"
  to = "/"
  status = 301
  force = true
